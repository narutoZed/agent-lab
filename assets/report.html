<script>

function effective(r,t){const merged={},provenance={};[...r.reviews].sort((a,b)=>(a.kind==='human')-(b.kind==='human')||Date.parse(a.created_at)-Date.parse(b.created_at)).forEach(rv=>rv.evaluations.forEach(e=>{merged[e.criterion_id]=e;provenance[e.criterion_id]=rv}));const required=t.criteria.filter(c=>c.required!==false),vs=required.map(c=>merged[c.id]?.verdict||'unknown');return{verdict:vs.includes('fail')?'fail':vs.every(v=>v==='pass')?'pass':'unknown',merged,provenance,passed:vs.filter(v=>v==='pass').length,known:vs.filter(v=>v!=='unknown').length,total:vs.length}}
function stable(v){if(Array.isArray(v))return '['+v.map(stable).join(',')+']';if(v&&typeof v==='object')return '{'+Object.keys(v).sort().filter(k=>k!=='review_id').map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}';return JSON.stringify(v)}
function allReviews(){return D.tasks.flatMap(t=>t.runs.flatMap(r=>r.reviews))}
function current(){return D.tasks[Number($('taskSelect').value)||0]}
function metricCell(v,method,format,max,extra=''){if(method==='not_run')return '<div class="v missing">—</div>';return `<div class="v ${v==null?'missing':''}">${v!=null&&method==='cached_input_ratio_lower_bound'?'≥':''}${format(v)}</div><small>${esc(methods[method]||method)}${extra?' · '+esc(extra):''}</small>${v!=null&&max>0?`<div class="bar"><i style="width:${Math.min(100,Math.max(0,v/max*100))}%"></i></div>`:''}`}
function draw(){const t=current(),rs=t.runs,outs=rs.map(r=>effective(r,t)),known=outs.filter(o=>o.verdict!=='unknown').length,passed=outs.filter(o=>o.verdict==='pass').length;let html=`<section class="card task-intro"><h2>${esc(t.title||t.id)}</h2><details class="task-description"><summary>查看任务正文</summary><p>${esc(t.prompt||'尚未填写统一任务说明')}</p></details></section>`;
const metricRuns=Object.keys(platformName).flatMap(platform=>{const matches=rs.filter(r=>r.platform===platform);return matches.length?matches:[{platform,missingRun:true}]});
html+=`<section class="card" id="metrics"><h2>资源与响应时间</h2><div class="table-wrap"><table><thead><tr><th>指标</th>${metricRuns.map(r=>`<th>${esc(r.missingRun||r.label===r.platform?platformName[r.platform]:r.label)}<small class="muted">${r.missingRun?'暂无执行记录':esc(r.models.join(', ')||'模型未记录')}</small></th>`).join('')}</tr></thead><tbody>`;
const rows=[['总 Token',r=>[r.tokens.total_tokens.value,r.tokens.total_tokens.method,r.platform==='epsilon'?'主模型调用，工具额外用量另列':''],fmt],['工具额外 Token（AgentRuntime）',r=>[r.tool_extra_tokens?.value,r.tool_extra_tokens?.method||'missing'],fmt],['输入 Token',r=>[r.tokens.input_tokens.value,r.tokens.input_tokens.method],fmt],['输出 Token',r=>[r.tokens.output_tokens.value,r.tokens.output_tokens.method],fmt],['缓存输入（输入子集）',r=>[r.tokens.cached_input_tokens.value,r.tokens.cached_input_tokens.method],fmt],['缓存率',r=>[r.cache_rate?.value,r.cache_rate?.method||'missing'],v=>v==null?'—':fmt(v)+'%'],['任务耗时',r=>[r.duration.value,r.duration.method],ms,'duration'],['工具调用次数',r=>[r.tool_call_count,r.source_format==='jahead_desktop_snapshot'?'已观察调用事件':'记录的独立调用 ID'],fmt],['工具调用错误数（error）',r=>[r.tool_error_count?.value,r.tool_error_count?.method||'missing'],fmt],['工具结果数量',r=>[r.tool_results_count,'已观察结果 / '+r.tool_call_count+' 次调用'],fmt],['工具响应均值',r=>[r.tool_latency.mean_ms,r.tool_latency.method, r.tool_latency.count+'/'+r.tool_call_count+' 次有计时'],ms,'tool_latency'],['工具响应 P95',r=>[r.tool_latency.p95_ms,r.tool_latency.method],ms,'tool_latency'],['LLM 响应均值',r=>[r.llm_latency.mean_ms,r.llm_latency.method,r.platform==='mesh'?r.llm_latency.count+' 个完成步骤':r.llm_latency.count+' 个请求有计时'],ms,'llm_latency'],['LLM 响应 P95',r=>[r.llm_latency.p95_ms,r.llm_latency.quantile_method||r.llm_latency.method],ms,'llm_latency'],['LLM 累计耗时',r=>[r.llm_latency.sum_ms,r.llm_latency.method],ms,'llm_latency'],['LLM 首 Token 均值',r=>[r.llm_first_token?.value,r.llm_first_token?.method||'missing',r.llm_first_token?.count!=null?r.llm_first_token.count+' 个步骤有计时':''],ms],['任务首 Token 耗时',r=>[r.first_token.value,r.first_token.method],ms]];
for(const [label,get,format,compat] of rows){const vals=metricRuns.map(r=>r.missingRun?[null,'not_run']:get(r)),same=(!compat||t.metric_compatibility[compat])&&t.alignment_confirmed&&vals.every(v=>v[0]!=null),max=same?Math.max(...vals.map(v=>v[0])):0;html+=`<tr><td>${label}${compat&&!t.metric_compatibility[compat]?'<small>口径不同或缺失，不画比较条</small>':''}</td>${vals.map(v=>'<td>'+metricCell(v[0],v[1],format,max,v[2])+'</td>').join('')}</tr>`}
html+=`</tbody></table></div><p class="foot">Epsilon 工具额外 Token 只统计工具事件报告的 usage，与主模型总 Token 分开；旧日志未采集时留空。部分工具采用运行时固定记账，不等同于供应商实测 Token。缓存率为缓存读取 Token / 含缓存的输入 Token；部分缓存记录仅给下界。错误数按明确标记统计，来源缺失不会视为零。工具耗时是调用到结果的跨度，可能含排队、封装和传输；并发调用的耗时之和不等于任务耗时。Codex exec 内部动作不重复加到顶层调用次数。Mesh LLM 计时沿用 metrics 的步骤口径（步骤开始至消息完成，可能含重试），P95 由逐步骤样本计算；其他请求计时按各自来源展示。LLM 首 Token 均值与整个任务首次产出 Token 的等待时间分开统计。</p></section>`;
html+=`<div class="evaluation-summary" aria-label="验收概况"><span>验收通过率：${known?fmt(passed/known*100)+'%':'待评价'}</span><span>评价覆盖率：${fmt(known/rs.length*100)}%</span><span>已验收通过：${passed} / ${rs.length}</span></div>`;
html+=`<section class="card"><h2>完成效果与最终回答</h2><div class="answers">`;
rs.forEach((r,i)=>{const o=outs[i];html+=`<article class="answer"><h3>${esc(r.label)} <span class="pill ${o.verdict}">${verdictName[o.verdict]}</span></h3><p class="muted">必需项通过 ${o.passed}/${o.total} · 已判定 ${o.known}/${o.total}<br>日志记录状态：${esc(r.execution_status)}（不等于验收通过）</p>${t.criteria.map(c=>{const e=o.merged[c.id],p=o.provenance[c.id];return `<div class="review-row"><b>${esc(c.description)}</b> <small class="muted">${c.required===false?"扩展项":"必需项"}</small><p class="${e?.verdict||'unknown'}">${verdictName[e?.verdict||'unknown']}${e?.score!=null?' · 质量分 '+esc(e.score)+'/4':''}</p>${e?`<p>${esc(e.reason)}</p><small class="muted">${esc(p.kind==='human'?'人工复核':'模型主评')} · ${esc(p.reviewer)} · 证据 ${esc((e.evidence||[]).join(', '))}</small>`:''}</div>`}).join('')}<details open><summary>最终回答${r.final_kind==='last_assistant_candidate'?'（末条回答候选）':''}</summary><pre>${esc(r.final_answer||'未记录最终回答')}</pre></details><details><summary>日志中的用户消息（${r.user_messages.length} 条）</summary>${r.user_messages.map(m=>`<pre>${esc(m.text)}</pre>`).join('')}</details>${r.artifacts.length?`<details><summary>关联产物（${r.artifacts.length}）</summary>${r.artifacts.map(a=>`<p><a href="${esc(a.uri)}" target="_blank" rel="noopener noreferrer">${esc(a.label)}</a> · ${fmt(a.bytes)} 字节</p><small class="muted">${esc(a.inspection)} · SHA256 ${esc(a.sha256)}</small>${a.text?`<pre>${esc(a.text)}</pre>`:''}`).join('')}</details>`:''}<details><summary>统计限制与来源</summary><p class="muted">自动推荐 ${r.interaction_summary?.recommended_answers||0} 次 · 权限批准 ${r.interaction_summary?.approved_permissions||0} 次</p><pre>${esc(JSON.stringify(r.interaction_policy||{}))}</pre>${r.warnings.map(w=>`<p class="muted">${esc(w)}</p>`).join('')}<pre>${esc(r.source)}\n${esc(JSON.stringify(r.selector))}\nSHA256 ${esc(r.source_sha256)}</pre></details><details><summary>工具调用与耗时明细</summary>${r.calls.map(c=>`<p>${esc(c.name)} · ${ms(c.duration_ms)} · ${c.is_error===true?'错误':c.result_ref?'有结果':'结果缺失'}<small class="muted"> ${esc(c.ref)} → ${esc(c.result_ref||'—')}</small></p>`).join('')||'<p>未记录工具调用</p>'}</details><details><summary>可核验证据与评价历史</summary>${r.events.filter(e=>e.kind!=='user').map(e=>`<b>${esc(e.ref)} · ${esc(e.kind)}</b><pre>${esc(e.text)}${e.excerpt?'\n[仅展示摘录，原始 '+e.original_chars+' 字符]':''}</pre>`).join('')}<pre>${esc(JSON.stringify(r.reviews,null,2))}</pre></details></article>`});
html+=`</div></section><section class="card review-form"><h2>人工复核</h2><p class="muted">模型评价通过 JSON 导入。人工复核按验收项覆盖模型结论，保留双方历史；选“待判定”可撤回未经证实的结论。</p><div class="form-grid"><div><label for="reviewRun">执行记录</label><select id="reviewRun">${rs.map((r,i)=>`<option value="${i}">${esc(r.label)}</option>`).join('')}</select></div><div><label for="reviewer">复核人</label><input class="wide" id="reviewer" placeholder="姓名或标识"></div></div><div id="criteriaForm"></div><button class="primary" id="saveReview">保存本次复核到报告</button><p class="foot">保存后请点击顶部“导出全部评价 JSON”。关闭页面前未导出的修改不会自动保存。</p></section>`;
$('body').innerHTML=html;$('reviewRun').addEventListener('change',drawForm);$('saveReview').addEventListener('click',saveReview);drawForm();}
function drawForm(){const t=current(),r=t.runs[Number($('reviewRun').value)],o=effective(r,t);$('criteriaForm').innerHTML=t.criteria.map((c,i)=>{const e=o.merged[c.id];return `<div class="criterion"><b>${esc(c.description)}</b> <span class="pill">${c.required===false?'可选':'必需'} · ${esc(c.verification||'answer')}</span><label for="verdict${i}">复核结论</label><select id="verdict${i}">${['unknown','pass','fail'].map(v=>`<option value="${v}" ${v===(e?.verdict||'unknown')?'selected':''}>${verdictName[v]}</option>`).join('')}</select><label for="reason${i}">理由</label><textarea id="reason${i}" placeholder="写明核验了什么，或缺少什么证据"></textarea><label for="evidence${i}">证据引用（用逗号分隔）</label><input class="wide" id="evidence${i}" value="${esc((e?.evidence||[]).join(', '))}" placeholder="${esc(r.final_ref||'L1:messages[0]')} / artifact:0"><small class="muted">从上方“可核验证据”复制 ref；产物验收需引用 artifact。</small></div>`}).join('')}
function validate(rv){const t=D.tasks.find(t=>t.runs.some(r=>r.id===rv.run_id)),r=t?.runs.find(r=>r.id===rv.run_id);if(!r)throw Error('未知 run_id');if(rv.fingerprint!==r.fingerprint||rv.rubric_hash!==t.rubric_hash)throw Error('日志/产物/标准已变化，旧评价不可导入');if(!['human','llm'].includes(rv.kind)||!rv.reviewer||(!Number.isFinite(Date.parse(rv.created_at))||!/(Z|[+-]\d\d:\d\d)$/.test(rv.created_at)))throw Error('评价者、类型或时间无效');if(!Array.isArray(rv.evaluations)||!rv.evaluations.length)throw Error('缺少验收项');const refs=new Map(r.events.map(e=>[e.ref,e])),seen=new Set();rv.evaluations.forEach(e=>{const c=t.criteria.find(c=>c.id===e.criterion_id);if(!c||seen.has(c.id))throw Error('未知或重复验收项');seen.add(c.id);if(!['pass','fail','unknown'].includes(e.verdict)||!e.reason?.trim())throw Error('每项需要结论和理由');if(!Array.isArray(e.evidence)||e.evidence.some(x=>!refs.has(x)))throw Error('证据引用不存在');if(e.verdict!=='unknown'&&!e.evidence.length)throw Error('通过/未通过必须引用证据');if(c.verification==='artifact'&&e.verdict!=='unknown'&&!e.evidence.some(x=>refs.get(x).kind==='artifact'))throw Error('产物验收必须引用 artifact');if(c.verification==='artifact'&&e.verdict!=='unknown'&&rv.kind==='llm'&&!e.evidence.some(x=>refs.get(x).inspection==='text_available'))throw Error('模型缺少可读产物内容');if(e.score!=null&&(typeof e.score!=='number'||!Number.isFinite(e.score)||e.score<0||e.score>4||e.verdict==='unknown'))throw Error('质量分需 0–4，未判定留空')});return r}
function saveReview(){try{const t=current(),r=t.runs[Number($('reviewRun').value)],reviewer=$('reviewer').value.trim();const rv={review_id:'human-'+Date.now()+'-'+Math.random().toString(16).slice(2),run_id:r.id,fingerprint:r.fingerprint,rubric_hash:t.rubric_hash,kind:'human',reviewer,created_at:new Date().toISOString(),evaluations:t.criteria.map((c,i)=>({criterion_id:c.id,verdict:$('verdict'+i).value,score:null,reason:$('reason'+i).value.trim(),evidence:$('evidence'+i).value.split(/[,，]/).map(s=>s.trim()).filter(Boolean)}))};validate(rv);r.reviews.push(rv);$('error').textContent='';$('saveState').textContent='有未导出的评价，请导出 JSON';draw()}catch(e){$('error').textContent=e.message}}
$('title').textContent=D.title;$('taskSelect').innerHTML=D.tasks.map((t,i)=>`<option value="${i}">${esc(t.title||t.id)}</option>`).join('');
const reportSelectionKey='agent-report-task:'+D.report_id;
let initialTask=0;const reportQuery=new URLSearchParams(location.search);
try{initialTask=Number(reportQuery.has('task')?reportQuery.get('task'):sessionStorage.getItem(reportSelectionKey))}catch{}
if(Number.isInteger(initialTask)&&initialTask>=0&&initialTask<D.tasks.length)$('taskSelect').value=String(initialTask);
function rememberTask(){const index=Number($('taskSelect').value);try{sessionStorage.setItem(reportSelectionKey,String(index));const url=new URL(location.href);url.searchParams.set('task',String(index));history.replaceState(null,'',url)}catch{}if(window.parent!==window&&location.origin!=='null')window.parent.postMessage({type:'agent-report-task',task:index},location.origin)}
$('taskSelect').addEventListener('change',()=>{draw();rememberTask()});rememberTask();
$('export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({schema_version:1,report_id:D.report_id,reviews:allReviews()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='agent-reviews.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('saveState').textContent='已触发评价下载，请保留 JSON 文件'});
$('import').addEventListener('click',()=>$('file').click());$('file').addEventListener('change',async()=>{try{const f=$('file').files[0];if(!f)return;const obj=JSON.parse(await f.text()),reviews=Array.isArray(obj)?obj:obj.reviews;if(!Array.isArray(reviews))throw Error('需要 reviews 数组');reviews.forEach(validate);const existing=new Map(allReviews().map(r=>[r.review_id||stable(r),stable(r)]));const incoming=new Map(existing);reviews.forEach(rv=>{const key=rv.review_id||stable(rv);if(incoming.has(key)&&incoming.get(key)!==stable(rv))throw Error('同一 review_id 对应冲突评价');incoming.set(key,stable(rv))});reviews.forEach(rv=>{const key=rv.review_id||stable(rv);if(!existing.has(key)){validate(rv).reviews.push(rv);existing.set(key,stable(rv))}});$('error').textContent='';$('saveState').textContent='已导入评价，可再次导出合并结果';draw()}catch(e){$('error').textContent=e.message}finally{$('file').value=''}});
draw();
</script></body></html>
