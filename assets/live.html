<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'"><title>Agent 任务实时追踪</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17243d;font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}header{background:#152747;color:white;padding:26px 4vw}h1{margin:5px 0;font-size:27px}header small{color:#b5c6e4;letter-spacing:2px}main{max-width:1450px;margin:auto;padding:24px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:18px;margin:20px 0}.card{background:white;border:1px solid #dce3ef;border-radius:12px;padding:20px;min-width:0}h2{font-size:21px;margin:0 0 10px}.pill{display:inline-block;border-radius:6px;padding:3px 9px;background:#eef1f7;color:#35507a;font-size:12px}.completed{background:#e5f5ee;color:#176341}.failed,.dispatch_unknown,.timed_out{background:#fff0ed;color:#9a352a}.manual_import_required,.needs_configuration,.awaiting_manual_submission{background:#fff4df;color:#89591a}.metric{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}.metric div{background:#f5f7fb;border-radius:8px;padding:10px}.metric strong{display:block;font-size:22px;font-variant-numeric:tabular-nums}.muted,small{color:#66758c}.notice{background:#fff6e5;color:#7b5826;border:1px solid #ead4a8;border-radius:8px;padding:12px;margin:14px 0}pre{font:12px/1.7 ui-monospace,Consolas,"Microsoft YaHei",monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:340px;overflow:auto}button{background:white;color:#294d9b;border:1px solid #b8c9e6;border-radius:7px;padding:8px 14px;cursor:pointer;font:inherit}summary{cursor:pointer;color:#345baf}footer{color:#66758c;font-size:12px}.error{color:#a83c35}#connection{font-size:13px}</style></head><body><header><small>AGENT RUN COMPARE / LIVE</small><h1 id="title">任务实时追踪</h1><span id="connection">正在连接本地追踪器…</span></header><main><div class="row"><span class="pill" id="id"></span><button id="copy">复制统一任务</button><button id="refresh">立即刷新</button><span class="muted">每 2 秒刷新 · 只读观察</span></div><div id="notice"></div><div class="grid" id="runs"></div><details class="card"><summary>统一任务正文与指纹</summary><pre id="prompt"></pre><small id="hash"></small></details><footer>执行完成不代表任务验收通过；结果交给模型主评与人工复核。即先桌面报告可实时追踪；历史轨迹仍可人工导入。停止本页面不会取消平台任务。</footer></main><script>
'use strict';const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const names={codex:'Codex',workbuddy:'WorkBuddy 本地助理',jahead:'Jahead / 即先 AI',mesh:'Mesh API',epsilon:'Epsilon API'};const labels={prepared:'待发布',needs_configuration:'待配置',dispatching:'正在提交',running:'运行中',submitted:'已提交，等待日志',completed:'执行完成',failed:'执行失败',dispatch_failed:'提交失败',dispatch_unknown:'提交结果不确定，勿重发',exited_unconfirmed:'发布器退出，结果待确认',cancelled:'已停止',timed_out:'超时',needs_input:'等待用户处理',awaiting_manual_submission:'等待人工提交',answer_observed:'已观察到回答，结束待确认',imported:'已导入轨迹'};const trackingNames={waiting:'等待日志',live:'实时数据已连接',imported:'已导入',manual_import_required:'等待上传轨迹',ambiguous:'日志匹配有歧义',binding_required:'需要绑定日志',parse_pending_or_error:'日志待完整或解析异常'};const methodNames={mesh_session_metrics:'Mesh metrics 步骤计时',mesh_step_event_span:'Mesh 步骤起止计时',mesh_run_first_token_span:'运行开始至首次流 Token',recorded_sum:'按已记录用量累计',reported_turn_usage:'轮次汇总用量',partial_sum:'仅部分用量',run_event_span:'运行起止事件跨度',reported_turn_duration:'原生任务耗时',observed_event_span:'事件跨度（估算）',client_observed_turn_span:'客户端观测跨度',client_observed_submission_span:'客户端提交至终态观测跨度',missing:'未记录'};const verdictNames={pending:'待评测',pass:'通过',fail:'未通过',unknown:'待核验',stale:'证据已变化'};let current=null,busy=false;const num=v=>v==null?'—':Number(v).toLocaleString('zh-CN',{maximumFractionDigits:1}),ms=v=>v==null?'—':num(v/1000)+' s';
async function refresh(){if(busy)return;busy=true;try{const res=await fetch('/snapshot',{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const d=await res.json();current=d;$('title').textContent=d.title;$('id').textContent=d.id;$('prompt').textContent=d.published_prompt;$('hash').textContent='任务 SHA256 '+d.prompt_sha256;$('connection').textContent='本地追踪器在线 · 更新于 '+new Date(d.updated_at).toLocaleTimeString();$('notice').innerHTML='';$('runs').innerHTML=d.runs.map(r=>{const m=r.metrics||{};return `<article class="card"><h2>${esc(names[r.platform])}</h2><span class="pill ${esc(r.status)}">${esc(labels[r.status]||r.status)}</span> <span class="pill ${esc(r.tracking)}">${esc(trackingNames[r.tracking]||'待核验')}</span>${r.note?`<div class="notice">${esc(r.note)}</div>`:''}${r.error?`<p class="error">${esc(r.error)}</p>`:''}<p class="muted">自动推荐 ${r.interaction_summary?.recommended_answers||0} 次 · 权限批准 ${r.interaction_summary?.approved_permissions||0} 次</p><div class="metric"><div>已记录 Token<strong>${num(m.total_tokens?.value)}</strong><small>${esc(methodNames[m.total_tokens?.method]||'尚无用量记录')}</small></div><div>工具调用<strong>${num(m.tool_calls)}</strong><small>已观察结果 ${num(m.tool_results)}</small></div><div>任务耗时<strong>${ms(m.duration?.value)}</strong><small>${esc(methodNames[m.duration?.method]||'等待完成或事件')}</small></div><div>工具响应均值<strong>${ms(m.tool_latency?.mean_ms)}</strong><small>${m.tool_latency?.count!=null?num(m.tool_latency.count)+' 次有计时':'尚无计时记录'}</small></div><div>LLM 响应均值<strong>${ms(m.llm_latency?.mean_ms)}</strong><small>${esc(methodNames[m.llm_latency?.method]||'无实际计时则留空')}</small></div>${m.llm_first_token?.value!=null?`<div>LLM 首 Token 均值<strong>${ms(m.llm_first_token.value)}</strong><small>Mesh metrics · ${num(m.llm_first_token.count)} 个步骤</small></div>`:''}${m.first_token?.value!=null?`<div>任务首 Token 耗时<strong>${ms(m.first_token.value)}</strong><small>${esc(methodNames[m.first_token.method]||m.first_token.method)}</small></div>`:''}${r.platform==='epsilon'?`<div>工具额外 Token<strong>${num(m.tool_extra_tokens?.value)}</strong><small>AgentRuntime 工具 usage · 不并入主模型总量</small></div>`:''}<div>工具错误数<strong>${num(m.tool_error_count?.value)}</strong><small>只统计明确错误标记</small></div><div>缓存率<strong>${m.cache_rate?.value==null?'—':(m.cache_rate.method==='cached_input_ratio_lower_bound'?'≥':'')+num(m.cache_rate.value)+'%'}</strong><small>缓存读取 / 含缓存输入</small></div><div>效果评价<strong>${esc(verdictNames[r.evaluation_status]||'待评测')}</strong><small>${r.evaluation_summary?'必需项通过 '+r.evaluation_summary.required_passed+'/'+r.evaluation_summary.required_total:'执行状态不代替完成率'}</small></div></div>${r.tracking==='manual_import_required'?'<p class="muted">使用任务包中的 prompt.txt 提交任务，完成后上传轨迹并绑定对应 record_id。</p>':''}${r.worker_health?`<p class="notice">${esc(r.worker_health)}：需要核查发布进程，不会自动重发任务。</p>`:''}<details ${r.final_answer?'open':''}><summary>最终回答 / 回答候选</summary><pre>${esc(r.final_answer||'尚未记录')}</pre></details><details><summary>追踪来源与限制</summary><pre>${esc(r.source||'尚未绑定日志')}\n${esc(JSON.stringify(r.selector||{}))}\n${esc((r.warnings||[]).join('\n'))}</pre></details></article>`}).join('')}catch(e){$('connection').textContent='连接中断，保留上次结果';$('notice').innerHTML='<div class="notice">追踪器未响应；页面显示的可能是旧数据。'+esc(e.message)+'</div>'}finally{busy=false}}
$('copy').onclick=async()=>{if(current){try{await navigator.clipboard.writeText(current.published_prompt);$('copy').textContent='已复制统一任务'}catch{$('notice').textContent='请展开下方统一任务正文手动复制。'}}};$('refresh').onclick=refresh;refresh();setInterval(refresh,2000);
</script></body></html>
